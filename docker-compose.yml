# Docker Compose Configuration for Blueprint Audio Backend

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blueprint-audio_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blueprint-audio_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blueprint-audio_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blueprint-audio_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blueprint-audio_api
    secrets:
      - metrics_token
    ports:
      - "8080:8080"
    environment:
      # Server
      PORT: ${PORT:-8080}
      ENV: ${ENV:-development}
      # Bearer token Prometheus uses to scrape /metrics (see prometheus service)
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # Migrations
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-db/migrations}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-blueprint-audio}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

      # S3/R2
      USE_S3: ${USE_S3:-true}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_REGION: ${S3_REGION:-auto}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}

      # Razorpay (use test credentials for dev)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

      # Dodo Payments (USD/global checkout)
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_PRODUCT_ID: ${DODO_PAYMENTS_PRODUCT_ID:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PAYMENTS_API_URL: ${DODO_PAYMENTS_API_URL:-}

      # Currency fallback for generated USD prices
      # FX rates
      FX_ENABLED: ${FX_ENABLED:-false}
      FX_PROVIDER_URL: ${FX_PROVIDER_URL:-https://api.frankfurter.dev/v1/latest}
      FX_API_KEY: ${FX_API_KEY:-}
      FX_REFRESH_INTERVAL: ${FX_REFRESH_INTERVAL:-24h}
      FX_STALE_AFTER: ${FX_STALE_AFTER:-36h}
      FX_MAX_AGE: ${FX_MAX_AGE:-168h}
      FX_MAX_DAILY_MOVE: ${FX_MAX_DAILY_MOVE:-0.20}
      FX_REPORTING_CURRENCY: ${FX_REPORTING_CURRENCY:-INR}

      # Media worker runs as the separate `worker` service by default
      WORKER_ENABLED: ${WORKER_ENABLED:-false}

      # Redis
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}                                                                     
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}                                                                                    
      RESEND_API_KEY: ${RESEND_API_KEY}                                                                                        
      EMAIL_FROM: ${EMAIL_FROM}                                                                                                
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./:/app
    networks:
      - blueprint-audio_network
    restart: unless-stopped

  # Durable beat media processor. It claims PostgreSQL jobs and streams
  # directly between object storage and the worker; no request temp files.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blueprint-audio_worker
    command: [ "./worker" ]
    environment:
      ENV: ${ENV:-development}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-blueprint-audio}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      USE_S3: ${USE_S3:-true}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_REGION: ${S3_REGION:-auto}

      WORKER_ID: ${WORKER_ID:-compose-worker}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-30m}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blueprint-audio_network
    restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: blueprint-audio_prometheus
    secrets:
      - metrics_token
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - blueprint-audio_network
    restart: unless-stopped

  # Monitoring - Grafana (Optional but highly recommended)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: blueprint-audio_grafana
    ports:
      - "3000:3000"
    networks:
      - blueprint-audio_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # minio_data:  # Removed - using R2
  #   driver: local

secrets:
  metrics_token:
    # Built from the METRICS_TOKEN env var so no gitignored file is needed on QA/prod
    environment: METRICS_TOKEN

networks:
  blueprint-audio_network:
    driver: bridge
